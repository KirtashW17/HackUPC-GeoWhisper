archived_projector:
  user: alice
  content: "El proyector del aula 04 viene con cable HDMI; no hace falta el adaptador."
  latitude: 41.2234
  longitude: 1.7290
  expires_at: <%= 6.hours.from_now.iso8601 %>
  # max_views nil + views_count 0: the only reason this note must be excluded
  # from the active feed is the archived flag, so tests that target the flag
  # are unambiguous.
  max_views:
  views_count: 0
  language: es
  visibility: 0
  archived: true
