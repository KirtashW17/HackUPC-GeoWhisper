en:
  app:
    name: GeoWhisper
    tagline: Ghost notes left in the world
  layout:
    sign_in: Sign in
    sign_up: Sign up
    sign_out: Sign out
    greeting: "Signed in as %{email}"
  home:
    welcome: Welcome to GeoWhisper
    visitor_hint: Sign in or create an account to start dropping ghost notes.
  auth:
    login:
      title: Welcome back
      eyebrow: Welcome back
      headline:
        prefix: "Pick up"
        emphasis: where you left
        suffix: "the last note."
      submit: Sign in
      invalid: Wrong email or password
      success: Signed in successfully
      no_account: "New here?"
      create_link: Make an account
    logout:
      success: Signed out
    signup:
      title: Create your account
      eyebrow: Make a small mark
      headline:
        prefix: "A name to"
        emphasis: sign
        suffix: "your whispers."
      submit: Begin
      success: Welcome to GeoWhisper
      have_account: "Already have a name?"
      login_link: Sign in
    fields:
      email: Email
      password: Password
      password_confirmation: Confirm password
    divider_or: or
    google_continue: Continue with Google
    soon: Soon
  locale_switcher:
    label: Language
    languages:
      en: English
      es: Spanish
      ca: Catalan
  onboarding:
    eyebrow: GeoWhisper
    headline:
      prefix: "Leave a note"
      emphasis: where you stood
      suffix: "."
    subhead: "Whispers only appear to those who walk close enough — and they fade after being read."
    bullets:
      anchored:
        title: Anchored
        body: A note lives at the place it was dropped.
      ephemeral:
        title: Ephemeral
        body: It vanishes after a time, or after a few reads.
      quiet:
        title: Quiet
        body: No followers, no feed — just here, just now.
    cta: Allow location & begin
    legal: WE NEVER STORE WHERE YOU'VE BEEN
  map:
    header:
      eyebrow: Nearby
      whispers:
        zero: "0 whispers"
        one: "1 whisper · %{radius}"
        other: "%{count} whispers · %{radius}"
      recenter: Recenter on me
    toggle:
      map: Map
      list: List
    loading:
      title: Looking around…
      body: Reading the air for whispers.
    empty:
      title: No ghosts nearby.
      body: Drop the first one — whoever passes through next will find it.
      preview:
        en: "EN · No ghosts nearby."
        es: "ES · Sin susurros aquí."
        ca: "CA · Cap xiuxiueig."
    peek:
      empty:
        title: No ghosts nearby.
        body: Be the first to leave a whisper here.
      meta:
        closest: closest
        time_ago_now: "just now"
        time_ago_minutes: "%{count}m ago"
        time_ago_hours: "%{count}h ago"
        time_ago_days: "%{count}d ago"
    cluster:
      eyebrow:
        one: "1 whisper here"
        other: "%{count} whispers here"
      here_eyebrow: "Right where you stand"
      distance_away: "%{meters}m away"
      close: Close stack
      peek:
        one: "1 whisper · %{meters}m"
        other: "%{count} whispers · %{meters}m"
    denied:
      eyebrow: Location needed
      headline:
        prefix: "GeoWhisper only works"
        emphasis: here
        suffix: "."
      body: "A whisper has nowhere to live without a place. Allow location to read or drop notes nearby — we never keep your trail."
      steps:
        label: How to enable
        items:
          - "Open Settings → Privacy → Location"
          - "Find GeoWhisper in the list"
          - "Choose “While Using the App”"
      retry: Try again
      browse_sample: Browse a sample of public whispers
  nav:
    map: Map
    drop: Drop
    me: Me
    soon: Soon
  compose:
    eyebrow: Drop a whisper
    headline:
      prefix: "Leave a note for"
      emphasis: whoever
      suffix: "passes here next."
    fields:
      content:
        label: Your whisper
        placeholder: "Sit by the window — they bring out the saffron buns at 4."
        counter: "%{count} / 500"
      ttl:
        label: Fades in
        options:
          quarter_hour: 15 minutes
          hour: 1 hour
          day: 1 day
          week: 1 week
      max_views:
        label: Reads allowed
        readout:
          one: "1 read"
          other: "%{count} reads"
        options:
          one: 1 read
          few: 5 reads
          many: 25 reads
          plenty: 100 reads
      visibility:
        label: Who can read it
        public: Anyone here
        friends: Friends only
        whisper: Just one person
    submit: Leave it here
    success: "Whisper left in the air."
    cancel: Cancel
    back: Back to the map
    location:
      placeholder: "Locked to your spot"
  detail:
    back: Back to map
    eyebrow:
      distance: "%{meters}m away"
      left_ago: "left %{time} ago"
    lifecycle:
      fades_in: Fades in
      reads_left: Reads left
      permanent: No time limit
      unlimited: Unlimited reads
    whisper_back: Whisper back
    report: Report
    archive:
      cta: Archive
      confirm: This whisper will disappear forever. Continue?
      success: Whisper archived.
    status:
      archived: Archived
      expired: Expired
      exhausted: Out of reads
      locked: Locked
      body: "Only you can see this. It no longer appears on the map."
    not_found:
      title: This whisper has vanished.
      body: It might have run out of reads or fallen out of the radius. Try the map.
  yourself:
    title: Yourself
    eyebrow: "@%{handle}"
    counter:
      dropped:
        one: "1 dropped"
        other: "%{count} dropped"
      alive:
        one: "1 still alive"
        other: "%{count} still alive"
    sections:
      languages: LANGUAGES
      presence: PRESENCE
      trail: YOUR TRAIL
    rows:
      whispers_in: Show whispers in
      interface: Interface
      search_radius: Search radius
      notify: Notify me when nearby
      anonymous: Anonymous mode
    placeholders:
      search_radius: 1 km
      notify: Sometimes
      anonymous: "Off"
    soon_badge: SOON
    trail:
      empty: "You haven't dropped any whispers yet — the world is quiet from here."
      meta:
        archived_label: archived
        alive_label: alive
        with_distance: "%{distance}m · %{state} · %{reads}"
        without_distance: "%{state} · %{reads}"
        vanished_ago: "vanished %{time} ago"
      reads:
        capped:
          one: "%{count}/%{max} read"
          other: "%{count}/%{max} reads"
        unlimited: unlimited reads
    sign_out: Sign out
    tagline: "be quiet, be here."
    version_line: "v 0.1 · %{handle}"
  flash:
    dismiss: Dismiss
  errors:
    forbidden: You need to sign in first.
